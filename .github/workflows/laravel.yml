name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.4'
    - uses: actions/checkout@v4
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    
    - name: Create .env.testing file
      run: |
        echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" > .env.testing
        echo "DB_CONNECTION=pgsql" >> .env.testing
        echo "DB_HOST=127.0.0.1" >> .env.testing
        echo "DB_PORT=5432" >> .env.testing
        echo "DB_DATABASE=testing" >> .env.testing
        echo "DB_USERNAME=test_user" >> .env.testing
        echo "DB_PASSWORD=test_pass" >> .env.testing

    - name: Execute tests (Unit and Feature tests) via PHPUnit/Pest
      run: php artisan test --env=testing
